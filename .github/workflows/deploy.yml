name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    # Redéploiement automatique chaque lundi à 5h UTC (6h ou 7h heure française)
    # Génère les nouvelles dates Before-Week à jour
    - cron: '0 5 * * 1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build for Cloudflare Pages
        run: npx @cloudflare/next-on-pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=odc-site --branch=main --commit-dirty=true
